# Example wt configuration.
# Copy to ~/.config/wt/config.yaml and customize for your setup.
# Add a new repo with `wt onboard <path> --name <repo> --yes`.

defaults:
  # {repo} is interpolated to the repo's name from the `repos:` map.
  worktree_root: ~/code/.worktrees/{repo}
  base: origin/main
  default_branch: main
  herdr_workspace: "{repo}"
  # Branch-shape patterns each pushed branch must match. Bash ERE.
  branch_patterns:
    - "^yourname/[a-z0-9-]+$"
    - "^yourname/[A-Z]+-[0-9]+-[a-z0-9-]+$"
    - "^pr-[0-9]+$"
  # Optional: extract issue keys from branch names and reject duplicate issue-key
  # worktrees in the same repo. Generic only; no Linear API or parent/child check.
  # Override intentionally with `wt new --allow-duplicate-issue-key <branch>`.
  # branch_issue_key_regex: "^[^/]+/([A-Z]+-[0-9]+)-"
  # enforce_unique_issue_keys: true
  # Protected refs (block direct push). Each entry is an EXACT branch name OR
  # a regex (auto-detected: starts with ^ or contains *?+|()[]{}\). Read by
  # guardrails branch-guard when running inside a wt-managed repo.
  protected_refs:
    - main
    - master
    - "^release/.*$"
  # Symlink these gitignored files from the canonical checkout into each new
  # worktree (live coupling). Repo-level lists replace this default list.
  # worktree_symlinks:
  #   - .env.local
  #   - .envrc-personal
  # Command run with cwd = the new worktree, after symlinks. Best-effort:
  # a non-zero exit warns but never fails `wt new`. Only runs on `wt new`.
  # setup_command: "direnv allow"

hooks:
  # Whether `wt pre-push` enforces branch_patterns. Opt-in.
  enforce_branch_names: false

# Per-repo (or defaults-level) autopush policy. Autopush is ON by default —
# worktree branches must not exist only on local disk. Set `false` on repos
# whose worktree branches are ephemeral staging (direct-main repos), where
# autopush would only leak stale branches to origin:
#
# repos:
#   my-direct-main-repo:
#     hooks:
#       autopush: false

repos:
  example-monorepo:
    path: ~/code/example-monorepo
    branch_patterns:
      - "^yourname/[A-Z]+-[0-9]+-[a-z0-9-]+$"
      - "^pr-[0-9]+$"
    # branch_issue_key_regex: "^[^/]+/([A-Z]+-[0-9]+)-"
    # enforce_unique_issue_keys: true

  example-service:
    path: ~/code/example-service
    # worktree_symlinks:
    #   - .env
    # setup_command: "direnv allow && yarn install"

# Paths under which wt refuses to operate (e.g. sub-agent isolation namespaces
# managed by another tool). wt will never create a worktree under these.
forbidden_roots: []

# Maximum length of a branch name (full ref, including owner prefix).
branch_max_length: 80
