name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install bash yq bats-core

      - name: Lint shell scripts
        run: bash -n git-wt

      - name: Run bats suite
        run: bash tests/run.sh

      - name: Smoke check
        run: ./git-wt --version
