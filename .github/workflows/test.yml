name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # GNU `parallel` is needed for `bats --jobs N` which tests/run.sh
        # uses by default (and would otherwise silently run zero tests).
        run: brew install bash yq bats-core parallel

      - name: Lint shell scripts
        run: bash -n git-wt

      - name: Run bats suite
        run: bash tests/run.sh

      - name: Smoke check
        run: ./git-wt --version
